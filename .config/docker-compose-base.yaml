services:
  grafana:
    user: root
    container_name: 'trickl-trickl-app'

    build:
      context: .
      args:
        grafana_image: ${GRAFANA_IMAGE:-grafana-enterprise}
        grafana_version: ${GRAFANA_VERSION:-12.4.0}
        development: ${DEVELOPMENT:-false}
        anonymous_auth_enabled: ${ANONYMOUS_AUTH_ENABLED:-true}
    ports:
      - 4000:3000/tcp
    volumes:
      - ../dist:/var/lib/grafana/plugins/trickl-trickl-app
      - ../provisioning:/etc/grafana/provisioning
      - ..:/root/trickl-trickl-app

    environment:
      NODE_ENV: development
      GF_LOG_FILTERS: plugin.trickl-trickl-app:debug
      GF_LOG_LEVEL: debug
      GF_DATAPROXY_LOGGING: 1
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: trickl-trickl-app
